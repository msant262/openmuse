<!DOCTYPE html>
<!-- biome-ignore lint/a11y/useValidLang: Expo replaces this token with the configured language on export. -->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8FAFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1018" media="(prefers-color-scheme: dark)" />
    <title>%WEB_TITLE%</title>
    <style>
      html,body,#root{width:100%;height:100%;margin:0}body{overflow:hidden;background:#f8faff;color:#121925}#root{display:flex;flex:1}
      #okami-launch{box-sizing:border-box;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:radial-gradient(ellipse at top right,#00dce815,transparent 55%),radial-gradient(ellipse at bottom left,#a234ff12,transparent 55%)}
      #okami-launch img{width:172px;height:172px;object-fit:contain}#okami-launch h1{font-size:42px;letter-spacing:-1.8px;margin:2px 0 24px;font-weight:800}#okami-launch h1 span{color:#007d91}
      .okami-dots{display:flex;gap:9px}.okami-dots i{width:8px;height:8px;border-radius:50%;background:#00c9de;animation:okami-pulse 1.4s ease-in-out infinite}.okami-dots i:nth-child(2){animation-delay:.16s;background:#00dce8}.okami-dots i:nth-child(3){animation-delay:.32s;background:#c42cef}
      @keyframes okami-pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.okami-dots i{animation:none}}@media(prefers-color-scheme:dark){body{background:#0b1018;color:#f4f7fb}#okami-launch h1 span{color:#00dce8}}
    </style>
  </head>
  <body>
    <div id="root"><div id="okami-launch" role="status" aria-label="OkamiBot"><img src="/okami-mark.png" alt="" /><h1>Okami<span>Bot</span></h1><div class="okami-dots" aria-hidden="true"><i></i><i></i><i></i></div><noscript>Ative o JavaScript para abrir o OkamiBot. Enable JavaScript to open OkamiBot.</noscript></div></div>
  </body>
</html>
