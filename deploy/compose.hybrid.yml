# MIT. Overlay: exactly two hosts, one VPS database writer; Lenovo uses native
# systemd services. Compose 2.24.4+ supports the explicit dependency override.
services:
  server:
    # PGlite recovery and the embedded harness exceeded 1280 MiB on cold start.
    # Reserve 2 GiB on the 8 GiB hybrid VPS; keep separate Hermes and OS reserves.
    mem_limit: 2g
    memswap_limit: 2g
    ports: !override ["${OPENMUSE_BIND_HOST:-127.0.0.1}:8787:8787"]
    depends_on: !override
      browser:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      COMPUTER_BACKEND: native
      COMPUTER_PROFILE: open
      COMPUTER_ENABLED: "true"
      NATIVE_EXECUTOR_ID: ${NATIVE_EXECUTOR_ID:?Set the registered Lenovo executor ID}
      NATIVE_EXECUTOR_REGISTRATIONS_FILE: /run/secrets/native-executors.json
      NATIVE_PYTHON_ENABLED: ${NATIVE_PYTHON_ENABLED:-false}
      NATIVE_PYTHON_MEMORY_MB: ${NATIVE_PYTHON_MEMORY_MB:-512}
      BROWSER_FALLBACK_ENABLED: "true"
      BROWSER_EXECUTOR_ID: openmuse-server
      RESOURCE_HOST_ID: openmuse-server
      COMPUTER_TOKEN: ""
  browser:
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      BROWSER_EXECUTOR_ID: openmuse-server
      BROWSER_REQUIRE_BINDING: "true"
  computer:
    profiles: [legacy-computer]
  computer-egress:
    profiles: [legacy-computer]
